<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="project_tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260330">

  <!-- Favicon: bump ?v= when replacing favicon.png (Firefox caches tab icons very aggressively). -->
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png?v=20260330">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=20260330">

  <title>Project Tracker</title>
  <link rel="manifest" href="manifest.json">

  <!-- Do NOT load firebase-*-compat.js here. FlutterFire (firebase_core_web) injects the
       modular Firebase JS SDK (v11.x) for app, auth, storage, etc. Mixing compat 10.x scripts
       with that breaks Storage interop (uncaught errors in guardWebExceptions / ref()). -->
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #2A2B2C;
    }
  </style>
</head>
<body>
  <!-- Drop stale Flutter service workers, then load the latest build. -->
  <script>
    (function () {
      function boot() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        document.body.appendChild(script);
      }
      if (!('serviceWorker' in navigator)) {
        boot();
        return;
      }
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var pending = [];
        for (var i = 0; i < regs.length; i++) pending.push(regs[i].unregister());
        return Promise.all(pending).then(function () {
          if (regs.length && !sessionStorage.getItem('pt_sw_cleared')) {
            sessionStorage.setItem('pt_sw_cleared', '1');
            location.reload();
            return;
          }
          boot();
        });
      }).catch(boot);
    })();
  </script>
</body>
</html>
